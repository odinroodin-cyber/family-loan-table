<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>借款折抵表</title>
<style>
  body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;margin:0;padding:16px;background:#f6f7f9;color:#222}
  h1{font-size:20px;margin:0 0 12px}
  .card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:12px}
  .cfg{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .cfg label{display:flex;gap:6px;align-items:center;font-size:14px}
  .cfg input[type=number]{width:110px;padding:4px 6px}
  .wrap{overflow-x:auto}
  table{border-collapse:collapse;background:#fff;min-width:900px;width:100%}
  th,td{border:1px solid #999;padding:6px;text-align:center;font-size:14px}
  th{background:#fafafa}
  th textarea.name{width:120px;text-align:center;border:1px dashed #bbb;padding:2px;font:inherit;font-weight:bold;resize:none}
  th input.amt{width:60px;text-align:right;padding:2px}
  th input.cnt{width:36px;text-align:center;padding:2px}
  .sub{font-size:12px;color:#555;font-weight:normal}
  td.date{white-space:nowrap;font-weight:bold}
  td input[type=checkbox]{width:20px;height:20px;margin:2px;cursor:pointer}
  td.num{text-align:right;white-space:nowrap}
  th.fix{white-space:nowrap;min-width:90px}
  td.ok{white-space:nowrap;min-width:90px}
  .rem{font-weight:bold}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  button{padding:8px 14px;border-radius:8px;border:1px solid #888;background:#fff;cursor:pointer;font-size:14px}
  button.primary{background:#2563eb;color:#fff;border-color:#2563eb}
  .summary{font-size:15px;line-height:1.9}
  .summary b{font-size:18px}
  #cards{display:none}
  .day{background:#fff;border:1px solid #ccc;border-radius:12px;margin-bottom:12px;overflow:hidden}
  .day .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#fafafa;border-bottom:1px solid #ddd;font-weight:bold}
  .day .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #eee}
  .day .it .nm{font-size:15px}
  .day .it .am{font-size:12px;color:#666}
  .day .it input[type=checkbox]{width:28px;height:28px;margin:3px}
  .day .ft{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:10px 12px;font-size:15px}
  .spr{display:flex;align-items:center;gap:4px;margin:3px 0}
  .spr input[type=checkbox]{width:22px;height:22px;flex:none}
  .spt{flex:1;min-width:0;padding:4px 6px;font-size:14px}
  .spa{width:72px;padding:4px 6px;font-size:14px;text-align:right}
  .spu{font-size:13px;color:#555}
  .spx{color:#c00;text-decoration:none;padding:0 4px;font-size:16px}
  button.spadd{padding:4px 10px;font-size:13px;margin-top:4px}
  th.sp,td.sp{min-width:240px;text-align:left}
  @media (max-width:760px){
    .spt,.spa{font-size:16px}
    .day .it .spr input[type=checkbox]{width:28px;height:28px}
    button.spadd{flex:none;padding:8px 14px}
    body{padding:10px}
    .wrap{display:none}
    #cards{display:block}
    .cfg{flex-direction:column;align-items:stretch}
    .cfg label{justify-content:space-between}
    .cfg input[type=number]{width:140px;font-size:16px}
    button{padding:12px 14px;font-size:16px;flex:1 1 45%}
    .summary{font-size:14px}
  }
  .sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sg div{display:flex;flex-direction:column;background:#f6f7f9;border-radius:8px;padding:6px 8px}
  .sg span{font-size:12px;color:#666}
  .sg b{font-size:18px}
  .sm{font-size:12px;color:#666;margin-top:6px}
  .nav{display:flex;gap:6px;margin-bottom:8px}
  .nav button{flex:1;padding:8px 4px;font-size:14px}
  @media (max-width:760px){
    h1{font-size:18px;margin:0 0 6px}
    #status{font-size:12px !important;padding:6px 10px;margin-bottom:4px}
    #sync{font-size:11px !important;margin:0 2px 6px !important}
    .card{padding:8px 10px;margin-bottom:8px}
    .summary{line-height:1.3}
    .sg{grid-template-columns:repeat(2,1fr);gap:6px}
    .sg b{font-size:17px}
    .nav button{padding:8px 4px;font-size:14px;flex:1 1 0}
    .day .hd{padding:8px 12px}
    .day .it{padding:7px 12px}
    .day .it .nm{font-size:14px}
    .day .it input[type=checkbox]{width:26px;height:26px}
  }
</style>
</head>
<body>
<h1>借款折抵表</h1>
<div class="card" id="status" style="font-size:14px"></div>
<div id="sync" style="font-size:13px;color:#555;margin:-6px 2px 10px"></div>

<div class="card" id="cfgCard">
  <div class="cfg">
    <label>借款總額 <input type="number" id="total" min="0"> 元</label>
    <label>年利率 <input type="number" id="rate" step="0.01" min="0"> %</label>
    <label>期數 <input type="number" id="term" min="1" step="1"> 期（月）</label>
    <label><input type="checkbox" id="deductDaily"> 每天另外扣掉「每日應繳」</label>
  </div>
</div>

<div class="card summary" id="summary"></div>

<div class="card" id="backend" style="display:none">
  <b>管理者後台</b>
  <div style="font-size:14px;margin:6px 0">在這裡可以取消某一天的確認，取消後那天就能重新勾選。</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
    <select id="unDay" style="padding:6px"></select>
    <button onclick="unconfirm()">取消這天的確認</button>
  </div>
</div>

<div class="wrap">
<table>
  <thead><tr id="h1"></tr><tr id="h2"></tr></thead>
  <tbody id="body"></tbody>
</table>
</div>

<div id="cards"></div>

<div class="btns">
  <button class="primary" onclick="addDay()">＋ 新增下一天</button>
  <button id="removeBtn" onclick="removeLast()">刪除最後一天</button>
  <button id="addTaskBtn" onclick="addTask()">＋ 新增項目</button>
  <button id="adminBtn" onclick="adminLogin()">管理者登入</button>
  <button id="pwdBtn" onclick="changePwd()" style="display:none">更改密碼</button>
  <button id="discardBtn" onclick="discard()" style="display:none">放棄修改</button>
  <button onclick="exportData()">匯出備份</button>
  <button id="importBtn" onclick="document.getElementById('imp').click()">匯入備份</button>
  <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)">
</div>

<script>
const KEY = 'family-loan-table-v1';
const defaults = {
  total: 0, rate: 0, term: 12, deductDaily: false,
  tasks: [
    {name:'挖貓砂+倒垃圾', amt:50, cnt:3},
    {name:'跳繩+拉筋', amt:50, cnt:3},
    {name:'曬衣服+摺衣服', amt:50, cnt:2},
    {name:'10:30前入睡', amt:50, cnt:1},
    {name:'拿外送食物', amt:10, cnt:1},
    {name:'小考90分以上', amt:50, cnt:3},
    {name:'英文週考高於平均+校排前100名', amt:1000, cnt:1},
    {name:'英文段考高於平均+校排前100名', amt:3000, cnt:1}
  ],
  start: '2026-11-17',
  days: 3,
  checks: {},
  confirmed: {},
  special: {}
};
let S = load();
let view = null, menuOpen = false;
function todayIndex(){ const a = new Date(S.start+'T00:00:00'), t = new Date(); t.setHours(0,0,0,0); return Math.round((t-a)/86400000); }
function dayDisc(d){
  let disc = 0;
  S.tasks.forEach((t, ti) => { for(let b=0; b<t.cnt; b++) if(S.checks[`${d}-${ti}-${b}`]) disc += Number(t.amt)||0; });
  return disc + spDisc(d);
}
// 每日計息：利息 = 當日剩餘本金 × 年利率 ÷ 365；折抵先抵利息，抵完才抵本金
function ledger(){
  const dp = dailyPay(), r = (Number(S.rate)||0)/100/365;
  let principal = Number(S.total)||0, accrued = 0, totalDisc = 0, pending = 0, totalInt = 0;
  const out = [];
  for(let d=0; d<S.days; d++){
    const disc = dayDisc(d);
    const interest = principal > 0 ? principal * r : 0;
    accrued += interest; totalInt += interest;
    let pay = 0;
    if(S.confirmed[d]){ pay += disc; totalDisc += disc; } else pending += disc;
    if(S.deductDaily) pay += dp;
    const toInt = Math.min(pay, accrued); accrued -= toInt; pay -= toInt;
    principal -= pay;
    out.push({disc, interest, toInt, principal, accrued, owed: principal + accrued});
  }
  return {days: out, principal, accrued, owed: principal + accrued, totalDisc, pending, totalInt};
}
function dayStats(){ return ledger().days.map(x => ({disc: x.disc, rem: x.owed})); }
function loadHistory(){
  const st = dayStats(); let h = '';
  for(let d=S.days-1; d>=0; d--){
    const ok = S.confirmed[d];
    h += `<div onclick="view=${d};renderBody();updateAdminUI()" style="padding:10px 12px;border-top:1px solid #eee;cursor:pointer;${d===view?'background:#eef4ff':''}">
      <div style="display:flex;justify-content:space-between;font-weight:bold"><span>${dateOf(d)}</span>${ok?'<span style="color:#14632d">✔ 已確認</span>':'<span style="color:#8a4b00">待確認</span>'}</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:#555;margin-top:3px"><span>${ok?'':'待確認 '}折抵 ${fmt(st[d].disc)} 元</span><span>剩餘本金+利息 ${fmt(st[d].rem)} 元</span></div></div>`;
  }
  document.getElementById('histList').innerHTML = h;
}
function go(n){ view += n; renderBody(); updateAdminUI(); }
// 日期自動補到今天
function extendToToday(){ const ti = todayIndex(); if(ti+1 > S.days){ S.days = ti+1; return true; } return false; }
if(extendToToday()) localStorage.setItem(KEY, JSON.stringify(S));

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return Object.assign({}, JSON.parse(JSON.stringify(defaults)), s); }catch(e){}
  return JSON.parse(JSON.stringify(defaults));
}
let isAdmin = false, dirty = false;
const PKEY = 'family-loan-admin-hash';
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); dirty = false; updateAdminUI(); schedulePush(); }

// ===== 雲端共用資料（textdb.dev）=====
const DB_URL = 'https://textdb.dev/api/data/family-loan-table-aa6e3c61-618f-4f94-a109-63a9d53e1783';
const BKEY = 'family-loan-table-base-v1';
const clone = o => JSON.parse(JSON.stringify(o));
const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);
let base = (function(){ try{ const b = JSON.parse(localStorage.getItem(BKEY)); if(b) return b; }catch(e){} return null; })();
let remoteReady = false, pushing = false, pushAgain = false, pushTimer = null, lastSync = null, syncState = 'loading';
function setSync(st, msg){
  syncState = st;
  const el = document.getElementById('sync'); if(!el) return;
  const t = lastSync ? lastSync.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}) : '';
  const m = {
    loading: '☁️ 正在讀取雲端資料…',
    saving: '☁️ 儲存中…',
    ok: '☁️ 已同步' + (t ? '（' + t + '）' : '') + '',
    error: '⚠️ 無法連線雲端，目前顯示這台裝置上的資料；修改會先存在這台裝置，連上後自動同步'
  };
  el.textContent = msg || m[st]; el.style.color = st==='error' ? '#b45309' : '#555';
}
async function fetchRemote(){
  const r = await fetch(DB_URL + '?t=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const txt = (await r.text()).trim();
  if(!txt) return null;            // 雲端還沒有資料
  const o = JSON.parse(txt);       // 格式錯誤會丟出例外，不會覆蓋雲端
  return Object.assign(clone(defaults), o);
}
async function putRemote(obj){
  const r = await fetch(DB_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(obj)});
  if(!r.ok) throw new Error('HTTP ' + r.status);
}
// 三方合併：只把「這台裝置自上次同步後改過的地方」套到雲端最新資料上
function merge3(b, l, r){
  b = b || {}; const out = clone(r);
  const keys = new Set([...Object.keys(b), ...Object.keys(l)]);
  for(const k of keys){
    if(k==='checks' || k==='confirmed'){
      const bb = b[k]||{}, ll = l[k]||{}; out[k] = out[k]||{};
      for(const s of new Set([...Object.keys(bb), ...Object.keys(ll)])){
        if(!!bb[s] !== !!ll[s]){ if(ll[s]) out[k][s] = true; else delete out[k][s]; }
      }
    } else if(k==='special'){
      const bb = b.special||{}, ll = l.special||{}; out.special = out.special||{};
      for(const d of new Set([...Object.keys(bb), ...Object.keys(ll)])){
        if(!same(bb[d], ll[d])){ if(ll[d]) out.special[d] = clone(ll[d]); else delete out.special[d]; }
      }
    } else if(k==='days'){
      if(l.days !== b.days) out.days = l.days < b.days ? l.days : Math.max(l.days, r.days||0);
    } else if(!same(l[k], b[k])) out[k] = clone(l[k]);
  }
  // 雲端已確認（鎖住）的日子，勾選以雲端為準
  for(const d in (r.confirmed||{})){
    if(!out.confirmed[d]) continue;
    for(const c in out.checks) if(c.startsWith(d+'-') && !r.checks[c]) delete out.checks[c];
    for(const c in r.checks) if(c.startsWith(d+'-')) out.checks[c] = true;
    out.special = out.special||{}; if(r.special && r.special[d]) out.special[d] = clone(r.special[d]); else delete out.special[d];
  }
  return out;
}
function editing(){ const a = document.activeElement; return a && (a.tagName==='TEXTAREA' || (a.tagName==='INPUT' && a.type!=='checkbox')); }
function applyRemote(newS){
  const changed = !same(newS, S);
  S = newS; localStorage.setItem(KEY, JSON.stringify(S));
  if(!changed) return;
  if(!editing()) init();
}
function setBase(b){ base = clone(b); localStorage.setItem(BKEY, JSON.stringify(base)); }
function schedulePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(push, 600); if(remoteReady && syncState!=='error') setSync('saving'); }
async function push(){
  if(!remoteReady){ return; }                 // 還沒讀到雲端資料前不寫入，避免蓋掉別人的資料
  if(pushing){ pushAgain = true; return; }
  if(base && same(S, base)){ setSync('ok'); return; }
  pushing = true; setSync('saving');
  try{
    const snap = clone(S);
    const remote = await fetchRemote();
    if(!remote) throw new Error('雲端資料是空的');
    let merged = merge3(base, snap, remote);
    await putRemote(merged);
    // 確認沒有被同時儲存的其他人蓋掉；被蓋掉就再合併一次
    let final = merged;
    for(let i=0; i<3; i++){
      await new Promise(r => setTimeout(r, 1200 + Math.random()*1500));
      const r2 = await fetchRemote();
      if(!r2) break;
      const again = merge3(base, snap, r2);
      if(same(again, r2)){ final = r2; break; }
      await putRemote(again); final = again;
    }
    merged = final;
    setBase(merged); lastSync = new Date();
    applyRemote(same(S, snap) ? merged : merge3(snap, S, merged));
    setSync('ok');
  }catch(e){ console.warn('push failed', e); setSync('error'); setTimeout(()=>schedulePush(), 15000); }
  pushing = false;
  if(pushAgain){ pushAgain = false; push(); }
}
async function pull(){
  if(pushing || (remoteReady && base && !same(S, base))) return;  // 有還沒送出的修改時先不拉，交給 push 合併
  try{
    const remote = await fetchRemote();
    if(remote === null) throw new Error('雲端資料是空的');   // 不用本機資料覆蓋雲端
    const local = clone(S);
    const merged = base ? merge3(base, local, remote) : remote;
    const firstLoad = !remoteReady;
    remoteReady = true; lastSync = new Date();
    if(!base){ setBase(remote); } else if(same(local, base)) { setBase(remote); }
    const prev = S; S = merged; const ext = extendToToday(); const newS = S; S = prev;
    applyRemote(newS); if(firstLoad) init();
    if(!same(S, base) || ext) schedulePush(); else setSync('ok');
  }catch(e){ console.warn('pull failed', e); if(!remoteReady || syncState!=='saving') setSync('error'); }
}
setInterval(() => { if(document.visibilityState==='visible') pull(); }, 20000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') pull(); });
window.addEventListener('online', () => pull());
async function sha(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }
async function adminLogin(){
  if(isAdmin){ isAdmin=false; init(); return; }
  const stored = S.adminHash || localStorage.getItem(PKEY) || await sha('1111');
  const p = prompt('請輸入管理者密碼：'); if(p===null) return;
  if(await sha(p) === stored) isAdmin = true; else { alert('密碼錯誤'); return; }
  init();
}
async function changePwd(){
  if(!isAdmin) return;
  const p1 = prompt('請輸入新的管理者密碼：'); if(!p1) return;
  const p2 = prompt('請再輸入一次確認：'); if(p1!==p2){ alert('兩次密碼不一樣，沒有變更。'); return; }
  S.adminHash = await sha(p1); localStorage.setItem(PKEY, S.adminHash); save(); alert('密碼已更新');
}
function discard(){ if(confirm('放棄所有還沒儲存的修改？')){ S = load(); dirty=false; init(); } }
function updateAdminUI(){
  refreshBackend();
  document.getElementById('cfgCard').style.display = isAdmin ? '' : 'none';
  document.getElementById('adminBtn').textContent = isAdmin ? '管理者登出' : '管理者登入';
  ['pwdBtn','addTaskBtn','removeBtn','importBtn'].forEach(id => document.getElementById(id).style.display = isAdmin ? '' : 'none');
  document.getElementById('discardBtn').style.display = 'none';
  document.querySelectorAll('.cfg input, th textarea, th input').forEach(el => el.disabled = !isAdmin);
  document.querySelectorAll('.delTask').forEach(el => el.style.display = isAdmin ? '' : 'none');
  const st = document.getElementById('status');
  if(isAdmin){ st.textContent = '管理者模式：可以確認每一天、修改金額、項目和借款設定，所有修改都會自動儲存'; st.style.background='#e7f6ec'; st.style.color='#14632d'; }
  else { st.textContent = '一般模式：勾選會自動儲存，管理者確認後才算數'; st.style.background='#eef2f7'; st.style.color='#333'; }
}


function dateOf(i){
  const d = new Date(S.start + 'T00:00:00'); d.setDate(d.getDate() + i);
  return (d.getFullYear()-1911) + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
}
const fmt = n => Math.round(n).toLocaleString('zh-TW');

// 本息平均攤還
function monthlyPay(){
  const P = Number(S.total)||0, n = Math.max(1, Math.round(Number(S.term)||1)), r = (Number(S.rate)||0)/100/12;
  if(P<=0) return 0;
  if(r===0) return P/n;
  return P * r * Math.pow(1+r,n) / (Math.pow(1+r,n)-1);
}
function totalOwed(){ const P = Number(S.total)||0; if(P<=0) return 0; return monthlyPay() * Math.max(1, Math.round(Number(S.term)||1)); }
function dailyPay(){ return monthlyPay()/30; }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function renderHeader(){
  const h1 = document.getElementById('h1'), h2 = document.getElementById('h2');
  let a = '<th rowspan="2">日期</th>', b = '';
  S.tasks.forEach((t, i) => {
    a += `<th><textarea class="name" rows="2" onchange="setTask(${i},'name',this.value)">${esc(t.name)}</textarea><br>
      <span class="sub">格數 <input class="cnt" type="number" min="1" max="10" value="${t.cnt}" onchange="setTask(${i},'cnt',this.value)">
      <a class="delTask" href="#" onclick="delTask(${i});return false" title="刪除項目" style="color:#c00;text-decoration:none">✕</a></span></th>`;
    b += `<th class="sub">單次折抵 <input class="amt" type="number" value="${t.amt}" onchange="setTask(${i},'amt',this.value)"> 元</th>`;
  });
  a += '<th class="sp" rowspan="2">特殊折抵</th><th class="fix" rowspan="2">管理者確認</th><th class="fix" rowspan="2">當日折抵</th><th class="fix" rowspan="2">當日利息</th><th class="fix" rowspan="2">剩餘本金<br>+利息</th>';
  h1.innerHTML = a; h2.innerHTML = b;
}

function renderBody(){
  let html = '';
  for(let d=0; d<S.days; d++){
    html += `<tr><td class="date">${dateOf(d)}</td>`;
    S.tasks.forEach((t, ti) => {
      html += '<td>';
      for(let b=0; b<t.cnt; b++){
        const k = `${d}-${ti}-${b}`;
        html += `<input type="checkbox" ${S.checks[k]?'checked':''} ${S.confirmed[d]?'disabled':''} onchange="toggle('${k}',this.checked)">`;
      }
      html += '</td>';
    });
    html += `<td class="sp">${spHtml(d)}</td>`;
    html += `<td class="ok">${S.confirmed[d] ? '<span style="color:#14632d;font-weight:bold">✔ 已確認</span>' : (isAdmin ? `<button onclick="confirmDay(${d},true)" style="padding:4px 10px">確認當天</button>` : '<span style="color:#8a4b00">待確認</span>')}</td><td class="num" data-disc="${d}"></td><td class="num" data-int="${d}"></td><td class="num rem" data-rem="${d}"></td></tr>`;
  }
  document.getElementById('body').innerHTML = html;
  let c = '';
  if(view===null) view = todayIndex();
  view = Math.max(0, Math.min(S.days-1, view));
  c += `<div class="nav"><button onclick="go(-1)" ${view<=0?'disabled':''}>◀ 前一天</button><button onclick="view=todayIndex();renderBody();updateAdminUI()">今天</button><button onclick="go(1)" ${view>=S.days-1?'disabled':''}>後一天 ▶</button></div>`;
  for(let d=view; d===view; d++){
    const st = S.confirmed[d] ? '<span style="color:#14632d">✔ 已確認</span>' : (isAdmin ? `<button onclick="confirmDay(${d},true)" style="flex:none;padding:6px 12px">確認當天</button>` : '<span style="color:#8a4b00">待確認</span>');
    c += `<div class="day"><div class="hd"><span>${dateOf(d)}</span>${st}</div>`;
    S.tasks.forEach((t, ti) => {
      let boxes = '';
      for(let b=0; b<t.cnt; b++){ const k = `${d}-${ti}-${b}`; boxes += `<input type="checkbox" ${S.checks[k]?'checked':''} ${S.confirmed[d]?'disabled':''} onchange="toggle('${k}',this.checked)">`; }
      c += `<div class="it"><div><div class="nm">${esc(t.name)}</div><div class="am">單次折抵 ${fmt(t.amt)} 元</div></div><div>${boxes}</div></div>`;
    });
    c += `<div class="it" style="display:block"><div class="nm" style="margin-bottom:6px">特殊折抵</div>${spHtml(d)}</div>`;
    c += `<div class="ft"><span>當日折抵 <span data-disc="${d}"></span></span><span>當日利息 <span data-int="${d}"></span></span><span>剩餘本金+利息 <b data-rem="${d}"></b></span></div></div>`;
  }
  c += `<details id="dayMenu" style="background:#fff;border:1px solid #ccc;border-radius:12px;margin-bottom:10px;overflow:hidden" ontoggle="menuOpen=this.open; if(this.open) loadHistory()"><summary style="padding:12px;font-weight:bold;cursor:pointer">📅 歷史紀錄（目前顯示 ${dateOf(view)}）</summary><div id="histList" style="max-height:55vh;overflow-y:auto"></div></details>`;
  document.getElementById('cards').innerHTML = c;
  calc();
}

function syncBoxes(){ document.querySelectorAll('input[type=checkbox][onchange^="toggle"]').forEach(el => { const k = el.getAttribute('onchange').match(/'(.+?)'/)[1]; el.checked = !!S.checks[k]; }); }
function setAll(t,d,v){ document.querySelectorAll(`[data-${t}="${d}"]`).forEach(el => el.textContent = v); }
function calc(){
  const mp = monthlyPay(), dp = dailyPay(), L = ledger();
  L.days.forEach((x, d) => {
    setAll('disc',d, (S.confirmed[d] ? fmt(x.disc) + ' 元' : '待確認 ' + fmt(x.disc) + ' 元'));
    setAll('int',d, '+' + (Math.round(x.interest*100)/100).toLocaleString('zh-TW') + ' 元');
    setAll('rem',d, fmt(x.owed) + ' 元');
  });
  document.getElementById('summary').innerHTML =
    `<div class="sg"><div><span>剩餘本金+利息</span><b>${fmt(L.owed)}</b></div><div><span>剩餘本金</span><b>${fmt(L.principal)}</b></div><div><span>未付利息</span><b>${fmt(L.accrued)}</b></div><div><span>已確認折抵</span><b>${fmt(L.totalDisc)}</b></div></div>
     <div class="sm">借款 ${fmt(S.total||0)} 元・年利率 ${S.rate||0}%（每天約增加 ${(Math.round(Math.max(0,L.principal)*(Number(S.rate)||0)/100/365*100)/100).toLocaleString('zh-TW')} 元利息）・${S.term||0} 期・每月應繳 ${fmt(mp)} 元・每日應繳 ${fmt(dp)} 元・待確認 ${fmt(pending=L.pending)} 元</div>
     <div class="sm">折抵會先抵掉未付利息，抵完才扣本金</div>`;
}
let pending = 0;

// ===== 特殊折抵：每天預設一個空白欄，可自行新增；勾選且管理者確認後才算 =====
function spList(d){ const l = S.special && S.special[d]; return (l && l.length) ? l : [{text:'', amt:0, on:false}]; }
function spEnsure(d){ S.special = S.special || {}; if(!S.special[d] || !S.special[d].length) S.special[d] = [{text:'', amt:0, on:false}]; return S.special[d]; }
function spDisc(d){ const l = S.special && S.special[d]; return l ? l.reduce((a,e) => a + (e.on ? (Number(e.amt)||0) : 0), 0) : 0; }
function spHtml(d){
  const lock = !!S.confirmed[d], dis = lock ? 'disabled' : '';
  let h = spList(d).map((e,i) => `<div class="spr">
    <input type="checkbox" ${e.on?'checked':''} ${dis} onchange="spSet(${d},${i},'on',this.checked)">
    <input type="text" class="spt" placeholder="說明" value="${esc(e.text||'')}" ${dis} oninput="spSet(${d},${i},'text',this.value)">
    <input type="number" class="spa" placeholder="金額" value="${e.amt?e.amt:''}" ${dis} oninput="spSet(${d},${i},'amt',this.value)"><span class="spu">元</span>
    ${lock ? '' : `<a href="#" class="spx" title="刪除" onclick="spDel(${d},${i});return false">✕</a>`}</div>`).join('');
  if(!lock) h += `<button class="spadd" onclick="spAdd(${d})">＋ 新增</button>`;
  return h;
}
function spSet(d, i, f, v){ if(S.confirmed[d]) return; const l = spEnsure(d); if(!l[i]) return;
  l[i][f] = f==='amt' ? (Number(v)||0) : f==='on' ? !!v : String(v); save(); calc(); }
function spAdd(d){ if(S.confirmed[d]) return; spEnsure(d).push({text:'', amt:0, on:false}); save(); renderBody(); }
function spDel(d, i){ if(S.confirmed[d]) return; const l = spEnsure(d); l.splice(i,1); if(!l.length) delete S.special[d]; save(); renderBody(); updateAdminUI(); }

function confirmDay(d, v){ if(!isAdmin) return; if(v && !confirm('確認 '+dateOf(d)+' 的勾選？確認後就鎖住，只能從管理者後台取消。')) return; if(v) S.confirmed[d]=true; else delete S.confirmed[d]; save(); renderBody(); updateAdminUI(); }
function refreshBackend(){
  const sel = document.getElementById('unDay'); let o = '';
  for(let d=0; d<S.days; d++) if(S.confirmed[d]) o += `<option value="${d}">${dateOf(d)}</option>`;
  sel.innerHTML = o || '<option value="">目前沒有已確認的日子</option>';
  document.getElementById('backend').style.display = isAdmin ? '' : 'none';
}
function unconfirm(){
  const v = document.getElementById('unDay').value; if(v==='') return;
  if(!confirm('取消 '+dateOf(Number(v))+' 的確認？')) return;
  delete S.confirmed[Number(v)]; save(); renderBody(); updateAdminUI();
}
function toggle(k, v){ const d = Number(k.split('-')[0]); if(S.confirmed[d]) return; setTimeout(syncBoxes,0); if(v) S.checks[k]=true; else delete S.checks[k]; save(); calc(); }
function setTask(i, f, v){ if(!isAdmin) return;
  if(f!=='name'){ v = Number(v)||0; if(f==='cnt') v = Math.max(1, Math.min(10, Math.round(v))); }
  S.tasks[i][f] = v; save(); renderHeader(); renderBody(); updateAdminUI();
}
function addTask(){ if(!isAdmin) return; S.tasks.push({name:'新項目', amt:50, cnt:1}); save(); renderHeader(); renderBody(); updateAdminUI(); }
function delTask(i){ if(!isAdmin) return;
  if(!confirm('確定刪除「'+S.tasks[i].name+'」這個項目？它的勾選紀錄也會一起刪掉。')) return;
  const nc = {};
  for(const k in S.checks){ const [d,t,b] = k.split('-').map(Number); if(t<i) nc[k]=true; else if(t>i) nc[`${d}-${t-1}-${b}`]=true; }
  S.checks = nc; S.tasks.splice(i,1); save(); renderHeader(); renderBody(); updateAdminUI();
}
function addDay(){ S.days++; view = S.days-1; save(); renderBody(); if(window.innerWidth>760) window.scrollTo(0, document.body.scrollHeight); else document.getElementById('cards').scrollIntoView(); }
function removeLast(){ if(!isAdmin) return;
  if(S.days<=1) return;
  if(!confirm('確定刪除 '+dateOf(S.days-1)+' 這一天？')) return;
  S.days--; delete S.confirmed[S.days]; if(S.special) delete S.special[S.days]; for(const k in S.checks) if(k.startsWith(S.days+'-')) delete S.checks[k];
  save(); renderBody();
}
function exportData(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download = '借款折抵表備份.json'; a.click();
}
function importData(e){
  const f = e.target.files[0]; if(!f) return;
  if(!isAdmin){ alert('只有管理者可以匯入備份，請先登入。'); e.target.value=''; return; }
  f.text().then(t => { S = Object.assign({}, JSON.parse(JSON.stringify(defaults)), JSON.parse(t)); save(); init(); });
}

function init(){
  ['total','rate','term'].forEach(id => {
    const el = document.getElementById(id); el.value = S[id];
    el.oninput = () => { if(!isAdmin) return; S[id] = Number(el.value)||0; save(); calc(); };
  });
  const dd = document.getElementById('deductDaily'); dd.checked = S.deductDaily;
  dd.onchange = () => { if(!isAdmin) return; S.deductDaily = dd.checked; save(); calc(); };
  renderHeader(); renderBody(); updateAdminUI();
}
init();
setSync('loading');
pull();
</script>
</body>
</html>
