<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>借款折抵表</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="折抵表">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E89B5B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f1e6;
    --paper:#fffaf3;
    --paper2:#fff6ea;
    --ink:#4a3728;
    --muted:#8a6e58;
    --line:#e8d5c0;
    --line2:#f0e2d2;
    --tea:#c4a484;
    --orange:#e89b5b;
    --orange-deep:#d67b3a;
    --peach:#fde8d0;
    --gold:#e8a84a;
    --ok:#3d7a4a;
    --ok-bg:#eef6e8;
    --wait:#9a5a1a;
    --shadow:0 6px 18px rgba(160,110,60,.10);
  }
  *{box-sizing:border-box}
  body{font-family:"Zen Maru Gothic","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;margin:0;padding:16px;background:var(--bg);color:var(--ink)}
  h1{font-size:20px;margin:0 0 10px;font-weight:700;letter-spacing:.02em}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
  .cheer{background:linear-gradient(180deg,#fff7ec,#ffeeda);border:1px solid #f0d3b0;border-radius:18px;padding:10px 14px;margin-bottom:10px;font-size:15px;font-weight:500;color:#6b3e22;box-shadow:var(--shadow);line-height:1.45}
  .cfg{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .cfg label{display:flex;gap:6px;align-items:center;font-size:14px}
  .cfg input[type=number]{width:110px;padding:4px 6px}
  input[type=number],input[type=text],textarea,select{font:inherit;border:1px solid var(--tea);border-radius:10px;background:#fff;color:var(--ink)}
  .wrap{overflow-x:auto;border-radius:18px;box-shadow:var(--shadow)}
  table{border-collapse:collapse;background:var(--paper);min-width:900px;width:100%;border-radius:18px;overflow:hidden}
  th,td{border:1px solid var(--line);padding:6px;text-align:center;font-size:14px}
  th{background:#f6eadb}
  th textarea.name{width:120px;text-align:center;border:1px dashed var(--tea);padding:2px;font:inherit;font-weight:700;resize:none;background:#fff}
  th input.amt{width:60px;text-align:right;padding:2px}
  th input.cnt{width:36px;text-align:center;padding:2px}
  .tico{font-style:normal;font-weight:400;margin-right:4px}
  .sub{font-size:12px;color:var(--muted);font-weight:normal}
  td.date{white-space:nowrap;font-weight:700}
  td.num{text-align:right;white-space:nowrap}
  th.fix{white-space:nowrap;min-width:90px}
  td.ok{white-space:nowrap;min-width:90px}
  tr.locked{background:#efe4d0}
  input:disabled,textarea:disabled{background:#f3eadc;color:#6b5344;opacity:.9;cursor:default}
  .rem{font-weight:700}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  button{padding:8px 14px;border-radius:14px;border:1px solid var(--tea);background:var(--paper);color:var(--ink);cursor:pointer;font:inherit;font-size:14px;box-shadow:0 2px 6px rgba(160,110,60,.08)}
  button.primary{background:var(--orange-deep);color:#fff;border-color:var(--orange-deep)}
  button:disabled{opacity:.45;cursor:default}
  .summary{font-size:15px;line-height:1.9}
  .summary b{font-size:18px}
  #cards{display:none}
  .day{background:var(--paper);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
  .day.locked{background:#f6ecdc;border-color:#d9b889}
  .day .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#f6eadb;border-bottom:1px solid var(--line);font-weight:700}
  .day.locked .hd{background:#efe3d0}
  .day .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line2)}
  .day .it .nm{font-size:15px;font-weight:500;word-break:break-word}
  .day .it .am{font-size:12px;color:var(--muted)}
  .day .ft{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:10px 12px;font-size:15px;background:#fff8f0}
  .spr{display:flex;align-items:center;gap:4px;margin:3px 0}
  .spt{flex:1;min-width:0;padding:4px 6px;font-size:14px}
  .spa{width:72px;padding:4px 6px;font-size:14px;text-align:right}
  .spu{font-size:13px;color:var(--muted)}
  .spx{color:#c45c3a;text-decoration:none;padding:0 4px;font-size:16px}
  button.spadd{padding:4px 10px;font-size:13px;margin-top:4px}
  th.sp,td.sp{min-width:240px;text-align:left}
  input.star{
    appearance:none;-webkit-appearance:none;
    width:26px;height:26px;margin:2px;padding:0;border:0;background:transparent;
    cursor:pointer;flex:none;vertical-align:middle;position:relative;display:inline-block
  }
  input.star::after{
    content:"☆";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:22px;line-height:1;color:#e0c4a0;transition:color .15s ease
  }
  input.star:checked::after{content:"★";color:var(--gold)}
  input.star.pop:checked::after{animation:pop .28s ease}
  input.star:disabled{cursor:default}
  input.star:disabled::after{color:#d3c0aa}
  input.star:disabled:checked::after{content:"★";color:#c48a3a}
  input.star:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:6px}
  @keyframes pop{
    0%{transform:scale(.6)}
    50%{transform:scale(1.28)}
    100%{transform:scale(1)}
  }
  .day .it input.star,.spr input.star{width:28px;height:28px}
  .day .it input.star::after,.spr input.star::after{font-size:24px}
  .prog{margin-top:10px}
  .prog .pl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);margin-bottom:5px}
  .prog .pl b{font-size:14px;color:var(--ink)}
  .bar{height:10px;background:#f0e0cc;border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0b27a,#e8894a);border-radius:999px;transition:width .4s ease}
  .hist{background:var(--paper);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
  .hist summary{padding:12px;font-weight:700;cursor:pointer;list-style:none}
  .hist summary::-webkit-details-marker{display:none}
  @media (max-width:760px){
    .spt,.spa{font-size:16px}
    .day .it .spr input.star{width:28px;height:28px}
    button.spadd{flex:none;padding:8px 14px}
    body{padding:10px}
    .wrap{display:none}
    #cards{display:block}
    .cfg{flex-direction:column;align-items:stretch}
    .cfg label{justify-content:space-between}
    .cfg input[type=number]{width:140px;font-size:16px}
    button{padding:12px 14px;font-size:16px;flex:1 1 45%}
    .summary{font-size:14px}
  }
  .sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sg div{display:flex;flex-direction:column;background:#f6eadb;border-radius:14px;padding:6px 8px}
  .sg span{font-size:12px;color:var(--muted)}
  .sg b{font-size:18px}
  .sm{font-size:12px;color:var(--muted);margin-top:6px}
  .nav{display:flex;gap:6px;margin-bottom:8px}
  .nav button{flex:1;padding:8px 4px;font-size:14px}
  @media (max-width:760px){
    h1{font-size:18px;margin:0 0 6px}
    .cheer{font-size:14px;padding:8px 10px;margin-bottom:8px}
    #status{font-size:12px !important;padding:6px 10px;margin-bottom:4px}
    #sync{font-size:11px !important;margin:0 2px 6px !important}
    .card{padding:8px 10px;margin-bottom:8px}
    .summary{line-height:1.3}
    .sg{grid-template-columns:repeat(2,1fr);gap:6px}
    .sg b{font-size:17px}
    .nav button{padding:8px 4px;font-size:14px;flex:1 1 0}
    .day .hd{padding:8px 12px}
    .day .it{padding:7px 12px}
    .day .it .nm{font-size:14px}
    .day .it input.star{width:26px;height:26px}
    .day .it input.star::after{font-size:22px}
  }

  button.retbtn{padding:6px 12px;flex:none;background:#fff;color:#c45c3a;border-color:#e2b6a6;font-weight:700}
  button.danger{background:#c45c3a;color:#fff;border-color:#c45c3a}
  .badge-ret{display:inline-block;color:#9a5a1a;background:#fff1e0;border:1px solid #f0d3b0;border-radius:999px;padding:3px 8px;font-size:13px;font-weight:700}
  input.star{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #dlg{display:none;position:fixed;inset:0;z-index:10000;background:rgba(74,55,40,.45);align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
  #dlg.show{display:flex}
  #dlg .box{background:var(--paper);border:1px solid var(--line);border-radius:20px 20px 16px 16px;padding:18px 16px 14px;width:100%;max-width:400px;box-shadow:0 16px 40px rgba(74,55,40,.22)}
  #dlg h2{margin:0 0 8px;font-size:18px}
  #dlg p{margin:0 0 12px;font-size:15px;line-height:1.55}
  #dlg input{width:100%;padding:12px;font-size:16px;margin:0 0 8px}
  #dlg .err{color:#c45c3a;font-size:13px;min-height:1.2em;margin:0 0 8px}
  #dlg .row{display:flex;gap:8px}
  #dlg .row button{flex:1;padding:12px 14px}
  @media (min-width:500px){
    #dlg{align-items:center}
    #dlg .box{border-radius:18px}
  }
</style>
</head>
<body>
<h1>借款折抵表</h1>
<div id="cheer" class="cheer"></div>
<div class="card" id="status" style="font-size:14px"></div>
<div id="sync" style="font-size:13px;color:#6b5344;margin:-6px 2px 10px"></div>

<div class="card" id="cfgCard">
  <div class="cfg">
    <label>借款總額 <input type="number" id="total" min="0"> 元</label>
    <label>年利率 <input type="number" id="rate" step="0.01" min="0"> %</label>
    <label>期數 <input type="number" id="term" min="1" step="1"> 期（月）</label>
    <label><input type="checkbox" id="deductDaily"> 每天另外扣掉「每日應繳」</label>
  </div>
</div>

<div class="card summary" id="summary"></div>

<div class="card" id="backend" style="display:none">
  <b>管理者後台</b>
  <div style="font-size:14px;margin:6px 0">已確認的那天，也可以直接在當天資料上按「退回」。退回後大家都能再修改，改完再按「確認當天」。</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
    <select id="unDay" style="padding:6px"></select>
    <button class="retbtn" onclick="unconfirm()">退回這天</button>
  </div>
</div>

<div class="wrap">
<table>
  <thead><tr id="h1"></tr><tr id="h2"></tr></thead>
  <tbody id="body"></tbody>
</table>
</div>

<div id="cards"></div>

<div class="btns">
  <button class="primary" onclick="addDay()">＋ 新增下一天</button>
  <button id="removeBtn" onclick="removeLast()">刪除最後一天</button>
  <button id="addTaskBtn" onclick="addTask()">＋ 新增項目</button>
  <button id="adminBtn" onclick="adminLogin()">管理者登入</button>
  <button id="pwdBtn" onclick="changePwd()" style="display:none">更改密碼</button>
  <button id="discardBtn" onclick="discard()" style="display:none">放棄修改</button>
  <button onclick="exportData()">匯出備份</button>
  <button id="importBtn" onclick="document.getElementById('imp').click()">匯入備份</button>
  <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)">
</div>


<div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="box" onclick="event.stopPropagation()">
    <h2 id="dlgTitle"></h2>
    <p id="dlgMsg"></p>
    <div id="dlgFields"></div>
    <div class="err" id="dlgErr"></div>
    <div class="row">
      <button type="button" id="dlgCancel">取消</button>
      <button type="button" class="primary" id="dlgOk">確定</button>
    </div>
  </div>
</div>

<script>
const KEY = 'family-loan-table-v1';
const defaults = {
  total: 0, rate: 0, term: 12, deductDaily: false,
  tasks: [
    {name:'挖貓砂+倒垃圾', amt:50, cnt:3},
    {name:'跳繩+拉筋', amt:50, cnt:3},
    {name:'曬衣服+摺衣服', amt:50, cnt:2},
    {name:'10:30前入睡', amt:50, cnt:1},
    {name:'拿外送食物', amt:10, cnt:1},
    {name:'小考90分以上', amt:50, cnt:3},
    {name:'英文週考高於平均+校排前100名', amt:1000, cnt:1},
    {name:'英文段考高於平均+校排前100名', amt:3000, cnt:1}
  ],
  start: '2026-11-17',
  days: 3,
  checks: {},
  confirmed: {},
  returned: {},
  special: {}
};
let S = load();
let view = null, menuOpen = false;
function todayIndex(){ const a = new Date(S.start+'T00:00:00'), t = new Date(); t.setHours(0,0,0,0); return Math.round((t-a)/86400000); }
function dayDisc(d){
  let disc = 0;
  S.tasks.forEach((t, ti) => { for(let b=0; b<t.cnt; b++) if(S.checks[`${d}-${ti}-${b}`]) disc += Number(t.amt)||0; });
  return disc + spDisc(d);
}
// 每日計息：利息 = 當日剩餘本金 × 年利率 ÷ 365；折抵先抵利息，抵完才抵本金
function ledger(){
  const dp = dailyPay(), r = (Number(S.rate)||0)/100/365;
  let principal = Number(S.total)||0, accrued = 0, totalDisc = 0, pending = 0, totalInt = 0;
  const out = [];
  for(let d=0; d<S.days; d++){
    const disc = dayDisc(d);
    const interest = principal > 0 ? principal * r : 0;
    accrued += interest; totalInt += interest;
    let pay = 0;
    if(S.confirmed[d]){ pay += disc; totalDisc += disc; } else pending += disc;
    if(S.deductDaily) pay += dp;
    const toInt = Math.min(pay, accrued); accrued -= toInt; pay -= toInt;
    principal -= pay;
    out.push({disc, interest, toInt, principal, accrued, owed: principal + accrued});
  }
  return {days: out, principal, accrued, owed: principal + accrued, totalDisc, pending, totalInt};
}
function dayStats(){ return ledger().days.map(x => ({disc: x.disc, rem: x.owed})); }
function loadHistory(){
  const st = dayStats(); let h = '';
  for(let d=S.days-1; d>=0; d--){
    const ok = S.confirmed[d];
    const tag = ok ? '<span style="color:#3d7a4a">✔ 已確認</span>' : ((S.returned && S.returned[d]) ? '<span class="badge-ret">已退回，請修正</span>' : '<span style="color:#9a5a1a">待確認</span>');
    h += `<div onclick="view=${d};renderBody();updateAdminUI()" style="padding:10px 12px;border-top:1px solid #f0e2d2;cursor:pointer;${d===view?'background:#fde8d0':''}">
      <div style="display:flex;justify-content:space-between;font-weight:bold;gap:8px;align-items:center"><span>${dateOf(d)}</span>${tag}</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:#8a6e58;margin-top:3px"><span>${ok?'':'待確認 '}折抵 ${fmt(st[d].disc)} 元</span><span>剩餘本金+利息 ${fmt(st[d].rem)} 元</span></div></div>`;
  }
  document.getElementById('histList').innerHTML = h;
}
function go(n){ view += n; renderBody(); updateAdminUI(); }
function goToday(){ view = todayIndex(); renderBody(); updateAdminUI(); }
function ensureMobileShell(){
  if(document.getElementById('dayNav')) return;
  const wrap = document.getElementById('cards');
  wrap.innerHTML = `<div id="dayNav" class="nav"><button type="button" id="prevDay">◀ 前一天</button><button type="button" id="todayBtn">今天</button><button type="button" id="nextDay">後一天 ▶</button></div><div id="dayCard"></div><details id="dayMenu" class="hist"><summary id="dayMenuSum"></summary><div id="histList" style="max-height:55vh;overflow-y:auto"></div></details>`;
  document.getElementById('prevDay').onclick = () => { if(view>0) go(-1); };
  document.getElementById('todayBtn').onclick = goToday;
  document.getElementById('nextDay').onclick = () => { if(view<S.days-1) go(1); };
  document.getElementById('dayMenu').addEventListener('toggle', function(){ menuOpen=this.open; if(this.open) loadHistory(); });
}
// 日期自動補到今天
function extendToToday(){ const ti = todayIndex(); if(ti+1 > S.days){ S.days = ti+1; return true; } return false; }
if(extendToToday()) localStorage.setItem(KEY, JSON.stringify(S));

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return Object.assign({}, JSON.parse(JSON.stringify(defaults)), s); }catch(e){}
  return JSON.parse(JSON.stringify(defaults));
}
let isAdmin = false, dirty = false;
const PKEY = 'family-loan-admin-hash';
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); dirty = false; updateAdminUI(); schedulePush(); }

// ===== 雲端共用資料（textdb.dev）=====
const DB_URL = 'https://textdb.dev/api/data/family-loan-table-aa6e3c61-618f-4f94-a109-63a9d53e1783';
const BKEY = 'family-loan-table-base-v1';
const clone = o => JSON.parse(JSON.stringify(o));
const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);
let base = (function(){ try{ const b = JSON.parse(localStorage.getItem(BKEY)); if(b) return b; }catch(e){} return null; })();
let remoteReady = false, pushing = false, pushAgain = false, pushTimer = null, lastSync = null, syncState = 'loading';
function setSync(st, msg){
  syncState = st;
  const el = document.getElementById('sync'); if(!el) return;
  const t = lastSync ? lastSync.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}) : '';
  const m = {
    loading: '☁️ 正在讀取雲端資料…',
    saving: '☁️ 儲存中…',
    ok: '☁️ 已同步' + (t ? '（' + t + '）' : '') + '',
    error: '⚠️ 無法連線雲端，目前顯示這台裝置上的資料；修改會先存在這台裝置，連上後自動同步'
  };
  el.textContent = msg || m[st]; el.style.color = st==='error' ? '#9a5a1a' : '#6b5344';
}
async function fetchRemote(){
  const r = await fetch(DB_URL + '?t=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const txt = (await r.text()).trim();
  if(!txt) return null;            // 雲端還沒有資料
  const o = JSON.parse(txt);       // 格式錯誤會丟出例外，不會覆蓋雲端
  return Object.assign(clone(defaults), o);
}
async function putRemote(obj){
  const r = await fetch(DB_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(obj)});
  if(!r.ok) throw new Error('HTTP ' + r.status);
}
// 三方合併：只把「這台裝置自上次同步後改過的地方」套到雲端最新資料上
function merge3(b, l, r){
  b = b || {}; const out = clone(r);
  const keys = new Set([...Object.keys(b), ...Object.keys(l)]);
  for(const k of keys){
    if(k==='checks' || k==='confirmed' || k==='returned'){
      const bb = b[k]||{}, ll = l[k]||{}; out[k] = out[k]||{};
      for(const s of new Set([...Object.keys(bb), ...Object.keys(ll)])){
        if(!!bb[s] !== !!ll[s]){ if(ll[s]) out[k][s] = true; else delete out[k][s]; }
      }
    } else if(k==='special'){
      const bb = b.special||{}, ll = l.special||{}; out.special = out.special||{};
      for(const d of new Set([...Object.keys(bb), ...Object.keys(ll)])){
        if(!same(bb[d], ll[d])){ if(ll[d]) out.special[d] = clone(ll[d]); else delete out.special[d]; }
      }
    } else if(k==='days'){
      if(l.days !== b.days) out.days = l.days < b.days ? l.days : Math.max(l.days, r.days||0);
    } else if(!same(l[k], b[k])) out[k] = clone(l[k]);
  }
  // 雲端已確認（鎖住）的日子，勾選以雲端為準
  for(const d in (r.confirmed||{})){
    if(!out.confirmed[d]) continue;
    for(const c in out.checks) if(c.startsWith(d+'-') && !r.checks[c]) delete out.checks[c];
    for(const c in r.checks) if(c.startsWith(d+'-')) out.checks[c] = true;
    out.special = out.special||{}; if(r.special && r.special[d]) out.special[d] = clone(r.special[d]); else delete out.special[d];
    if(out.returned) delete out.returned[d];
  }
  return out;
}
function editing(){ const a = document.activeElement; return a && (a.tagName==='TEXTAREA' || (a.tagName==='INPUT' && a.type!=='checkbox')); }
function applyRemote(newS){
  const changed = !same(newS, S);
  S = newS; localStorage.setItem(KEY, JSON.stringify(S));
  if(!changed) return;
  if(!editing()) init();
}
function setBase(b){ base = clone(b); localStorage.setItem(BKEY, JSON.stringify(base)); }
function schedulePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(push, 600); if(remoteReady && syncState!=='error') setSync('saving'); }
async function push(){
  if(!remoteReady){ return; }                 // 還沒讀到雲端資料前不寫入，避免蓋掉別人的資料
  if(pushing){ pushAgain = true; return; }
  if(base && same(S, base)){ setSync('ok'); return; }
  pushing = true; setSync('saving');
  try{
    const snap = clone(S);
    const remote = await fetchRemote();
    if(!remote) throw new Error('雲端資料是空的');
    let merged = merge3(base, snap, remote);
    await putRemote(merged);
    // 確認沒有被同時儲存的其他人蓋掉；被蓋掉就再合併一次
    let final = merged;
    for(let i=0; i<3; i++){
      await new Promise(r => setTimeout(r, 1200 + Math.random()*1500));
      const r2 = await fetchRemote();
      if(!r2) break;
      const again = merge3(base, snap, r2);
      if(same(again, r2)){ final = r2; break; }
      await putRemote(again); final = again;
    }
    merged = final;
    setBase(merged); lastSync = new Date();
    applyRemote(same(S, snap) ? merged : merge3(snap, S, merged));
    setSync('ok');
  }catch(e){ console.warn('push failed', e); setSync('error'); setTimeout(()=>schedulePush(), 15000); }
  pushing = false;
  if(pushAgain){ pushAgain = false; push(); }
}
async function pull(){
  if(pushing || (remoteReady && base && !same(S, base))) return;  // 有還沒送出的修改時先不拉，交給 push 合併
  try{
    const remote = await fetchRemote();
    if(remote === null) throw new Error('雲端資料是空的');   // 不用本機資料覆蓋雲端
    const local = clone(S);
    const merged = base ? merge3(base, local, remote) : remote;
    const firstLoad = !remoteReady;
    remoteReady = true; lastSync = new Date();
    if(!base){ setBase(remote); } else if(same(local, base)) { setBase(remote); }
    const prev = S; S = merged; const ext = extendToToday(); const newS = S; S = prev;
    applyRemote(newS); if(firstLoad) init();
    if(!same(S, base) || ext) schedulePush(); else setSync('ok');
  }catch(e){ console.warn('pull failed', e); if(!remoteReady || syncState!=='saving') setSync('error'); }
}

  return new Promise(resolve => {

    const msg = document.getElementById('dlgMsg');
    msg.textContent = message || '';

    box.innerHTML = fields || '';
    const okBtn = document.getElementById('dlgOk');
    const cancelBtn = document.getElementById('dlgCancel');
    okBtn.textContent = ok;
    cancelBtn.textContent = cancel || '取消';
    cancelBtn.style.display = cancel ? '' : 'none';
    okBtn.className = danger ? 'danger' : 'primary';
    dlgWait = resolve;
    dlg.classList.add('show');
    document.body.style.overflow = 'hidden';
    const first = box.querySelector('input');
    setTimeout(() => (first || okBtn).focus(), 50);
    okBtn.onclick = async () => {
      const inputs = [...box.querySelectorAll('input')].map(i => i.value);

      }
      closeDlg(fields ? (inputs.length<=1 ? (inputs[0] ?? '') : inputs) : true);
    };
    cancelBtn.onclick = () => closeDlg(null);
  });
}

function dateOf(i){
  const d = new Date(S.start + 'T00:00:00'); d.setDate(d.getDate() + i);
  return (d.getFullYear()-1911) + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
}
const fmt = n => Math.round(n).toLocaleString('zh-TW');

// 本息平均攤還
function monthlyPay(){
  const P = Number(S.total)||0, n = Math.max(1, Math.round(Number(S.term)||1)), r = (Number(S.rate)||0)/100/12;
  if(P<=0) return 0;
  if(r===0) return P/n;
  return P * r * Math.pow(1+r,n) / (Math.pow(1+r,n)-1);
}
function totalOwed(){ const P = Number(S.total)||0; if(P<=0) return 0; return monthlyPay() * Math.max(1, Math.round(Number(S.term)||1)); }
function dailyPay(){ return monthlyPay()/30; }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function taskIcon(name){
  const n = String(name||'');
  if(/貓砂|垃圾/.test(n)) return '🐱';
  if(/跳繩|拉筋/.test(n)) return '🤸';
  if(/衣服/.test(n)) return '🧺';
  if(/入睡|睡/.test(n)) return '🌙';
  if(/外送/.test(n)) return '🛵';
  if(/英文/.test(n)) return '🏆';
  if(/小考|考/.test(n)) return '📚';
  return '🌟';
}
function cheerText(){
  const d = todayIndex();
  if(d < 0) return '開始日還沒到，先慢慢準備就好 🌼';
  if(d >= S.days) return '今天也辛苦了！💛';
  if(S.confirmed[d]) return '今天的努力已確認，真的辛苦了！好好休息吧 🌙';
  if(S.returned && S.returned[d]) return '管理者已退回今天，請再檢查一次，打錯的可以先改掉 ✨';
  let total = 0, done = 0;
  S.tasks.forEach((t, ti) => { for(let b=0; b<t.cnt; b++){ total++; if(S.checks[`${d}-${ti}-${b}`]) done++; } });
  const spOn = ((S.special && S.special[d]) || []).filter(e => e.on).length;
  if(done === 0 && spOn === 0) return '今天也辛苦了！先從一件小事開始吧 💛';
  if(total > 0 && done >= total) return '今天的項目都勾完了，等管理者確認就可以折抵囉 🌟';
  return '做得很好！已經完成 ' + (done + spOn) + ' 項，繼續加油 ✨';
}

function spList(d){ const l = S.special && S.special[d]; return (l && l.length) ? l : [{text:'', amt:0, on:false}]; }
function spEnsure(d){ S.special = S.special || {}; if(!S.special[d] || !S.special[d].length) S.special[d] = [{text:'', amt:0, on:false}]; return S.special[d]; }

  const lock = !!S.confirmed[d], dis = lock ? 'disabled' : '';

    <input type="checkbox" class="star" ${e.on?'checked':''} ${dis} onchange="this.classList.add('pop');spSet(${d},${i},'on',this.checked)">

    ${lock ? '' : `<a href="#" class="spx" title="刪除" onclick="spDel(${d},${i});return false">✕</a>`}</div>`).join('');
  if(!lock) h += `<button class="spadd" onclick="spAdd(${d})">＋ 新增</button>`;

function importData(e){
  const f = e.target.files[0]; if(!f) return;
  if(!isAdmin){ openDlg({title:'無法匯入', message:'只有管理者可以匯入備份，請先登入。', ok:'知道了', cancel:''}); e.target.value=''; return; }
  f.text().then(t => { S = Object.assign({}, JSON.parse(JSON.stringify(defaults)), JSON.parse(t)); save(); init(); });
}

function init(){
  ['total','rate','term'].forEach(id => {
    const el = document.getElementById(id); el.value = S[id];
    el.oninput = () => { if(!isAdmin) return; S[id] = Number(el.value)||0; save(); calc(); };
  });
  const dd = document.getElementById('deductDaily'); dd.checked = S.deductDaily;
  dd.onchange = () => { if(!isAdmin) return; S.deductDaily = dd.checked; save(); calc(); };
  renderHeader(); renderBody(); updateAdminUI();
}
init();
setSync('loading');
pull();
</script>
</body>
</html>
